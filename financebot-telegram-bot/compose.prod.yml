services:
  financebot-telegram-bot:
    build: .
    container_name: financebot-telegram-bot

    restart: always

    ports:
      - "8081:8081"
      - "127.0.0.1:8083:8083"

    env_file:
      - .env

    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      FINANCEBOT_API_URL: ${FINANCEBOT_API_URL}
      TELEGRAM_INTERNAL_TOKEN: ${TELEGRAM_INTERNAL_TOKEN}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      TELEGRAM_STATE_STORE: ${TELEGRAM_STATE_STORE}
      TELEGRAM_CONVERSATION_CONTEXT_TTL: ${TELEGRAM_CONVERSATION_CONTEXT_TTL}
      TELEGRAM_QUERY_CONTEXT_TTL: ${TELEGRAM_QUERY_CONTEXT_TTL}
      FINANCEBOT_AI_ENABLED: ${FINANCEBOT_AI_ENABLED}
      FINANCEBOT_AI_ENDPOINT: ${FINANCEBOT_AI_ENDPOINT}
      FINANCEBOT_AI_API_KEY: ${FINANCEBOT_AI_API_KEY}
      FINANCEBOT_AI_MODEL: ${FINANCEBOT_AI_MODEL}
      FINANCEBOT_AI_TIMEOUT: ${FINANCEBOT_AI_TIMEOUT}
      FINANCEBOT_AI_TRANSCRIPTION_ENDPOINT: ${FINANCEBOT_AI_TRANSCRIPTION_ENDPOINT}
      FINANCEBOT_AI_TRANSCRIPTION_MODEL: ${FINANCEBOT_AI_TRANSCRIPTION_MODEL}
      FINANCEBOT_MANAGEMENT_PORT: 8083
      FINANCEBOT_MANAGEMENT_ADDRESS: 0.0.0.0

    networks:
      - backend-network

networks:
  backend-network:
    external: true
