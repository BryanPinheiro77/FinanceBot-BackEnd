services:
  postgres:
    image: postgres:17
    container_name: financebot-postgres-local
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - financebot_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: financebot-redis-local
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Configure REDIS_PASSWORD no arquivo .env}"]
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: financebot-rabbitmq-local
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Configure RABBITMQ_USER no arquivo .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Configure RABBITMQ_PASSWORD no arquivo .env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:?Configure RABBITMQ_VHOST no arquivo .env}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT}:15672"

volumes:
  financebot_postgres_data:
