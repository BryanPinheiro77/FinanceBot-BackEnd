spring.application.name=financebot-telegram-bot

server.port=8081

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.bot.username=YourFinanceAssistant_Bot

financebot.api.base-url=${FINANCEBOT_API_URL}
financebot.api.internal-token=${TELEGRAM_INTERNAL_TOKEN:}

financebot.ai.enabled=${FINANCEBOT_AI_ENABLED:false}
financebot.ai.endpoint=${FINANCEBOT_AI_ENDPOINT:}
financebot.ai.api-key=${FINANCEBOT_AI_API_KEY:}
financebot.ai.model=${FINANCEBOT_AI_MODEL:gpt-4o-mini}
financebot.ai.timeout=${FINANCEBOT_AI_TIMEOUT:10s}

telegram.state.store=${TELEGRAM_STATE_STORE:memory}
telegram.conversation.context-ttl=${TELEGRAM_CONVERSATION_CONTEXT_TTL:30m}
telegram.conversation.query-context-ttl=${TELEGRAM_QUERY_CONTEXT_TTL:30m}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
