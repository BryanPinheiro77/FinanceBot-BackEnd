spring.application.name=financebot-telegram-bot

server.port=8081

management.server.port=${FINANCEBOT_MANAGEMENT_PORT:8083}
management.server.address=${FINANCEBOT_MANAGEMENT_ADDRESS:127.0.0.1}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
logging.structured.format.console=${FINANCEBOT_LOG_FORMAT:ecs}

telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.bot.username=YourFinanceAssistant_Bot

financebot.api.base-url=${FINANCEBOT_API_URL}
financebot.api.internal-token=${TELEGRAM_INTERNAL_TOKEN:}
financebot.ai.enabled=${FINANCEBOT_AI_ENABLED:false}
financebot.ai.endpoint=${FINANCEBOT_AI_ENDPOINT:}
financebot.ai.api-key=${FINANCEBOT_AI_API_KEY:}
financebot.ai.model=${FINANCEBOT_AI_MODEL:gpt-4o-mini}
financebot.ai.timeout=${FINANCEBOT_AI_TIMEOUT:10s}
financebot.ai.transcription-endpoint=${FINANCEBOT_AI_TRANSCRIPTION_ENDPOINT:}
financebot.ai.transcription-model=${FINANCEBOT_AI_TRANSCRIPTION_MODEL:whisper-1}

telegram.state.store=${TELEGRAM_STATE_STORE:memory}
telegram.conversation.context-ttl=${TELEGRAM_CONVERSATION_CONTEXT_TTL:30m}
telegram.conversation.query-context-ttl=${TELEGRAM_QUERY_CONTEXT_TTL:30m}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.listener.simple.default-requeue-rejected=false
