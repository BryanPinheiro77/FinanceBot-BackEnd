global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: financebot-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [host.docker.internal:8082]

  - job_name: financebot-telegram-bot
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [host.docker.internal:8083]
