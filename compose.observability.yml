name: financebot-observability

services:
  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: financebot-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - financebot_prometheus_data:/prometheus
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.4
    container_name: financebot-loki
    command: -config.file=/etc/loki/local-config.yml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./observability/loki/config.yml:/etc/loki/local-config.yml:ro
      - financebot_loki_data:/loki
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.19.2
    container_name: financebot-alloy
    command:
      - run
      - /etc/alloy/config.alloy
    depends_on:
      - loki
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.0
    container_name: financebot-grafana
    depends_on:
      - prometheus
      - loki
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - financebot_grafana_data:/var/lib/grafana
    restart: unless-stopped

volumes:
  financebot_prometheus_data:
  financebot_loki_data:
  financebot_grafana_data:
