services:
  financebot:
    build: .
    container_name: financebot-backend

    restart: always

    ports:
      - "8080:8080"
      - "127.0.0.1:8082:8082"

    env_file:
      - .env

    environment:
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_USER: ${REDIS_USER:-default}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_SSL_ENABLED: ${REDIS_SSL_ENABLED:-false}

      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      RABBITMQ_SSL_ENABLED: ${RABBITMQ_SSL_ENABLED:-false}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      FINANCEBOT_DATA_ENCRYPTION_KEY: ${FINANCEBOT_DATA_ENCRYPTION_KEY}
      FINANCEBOT_DATA_ENCRYPTION_ACTIVE_KEY_ID: ${FINANCEBOT_DATA_ENCRYPTION_ACTIVE_KEY_ID:-primary}
      FINANCEBOT_DATA_ENCRYPTION_LEGACY_KEY_ID: ${FINANCEBOT_DATA_ENCRYPTION_LEGACY_KEY_ID-primary}
      FINANCEBOT_DATA_ENCRYPTION_PREVIOUS_KEYS: ${FINANCEBOT_DATA_ENCRYPTION_PREVIOUS_KEYS:-}
      FINANCEBOT_DATA_ENCRYPTION_ROTATION_ENABLED: ${FINANCEBOT_DATA_ENCRYPTION_ROTATION_ENABLED:-false}
      FINANCEBOT_DATA_ENCRYPTION_ROTATION_BACKUP_CONFIRMED: ${FINANCEBOT_DATA_ENCRYPTION_ROTATION_BACKUP_CONFIRMED:-false}
      FINANCEBOT_DATA_ENCRYPTION_ROTATION_BATCH_SIZE: ${FINANCEBOT_DATA_ENCRYPTION_ROTATION_BATCH_SIZE:-100}
      FINANCEBOT_DATA_ENCRYPTION_ROTATION_INTERVAL_MS: ${FINANCEBOT_DATA_ENCRYPTION_ROTATION_INTERVAL_MS:-1000}
      FINANCEBOT_SQL_LOGGING_ENABLED: ${FINANCEBOT_SQL_LOGGING_ENABLED:-false}
      FINANCEBOT_REMINDERS_QUEUE_MESSAGE_TTL_MS: ${FINANCEBOT_REMINDERS_QUEUE_MESSAGE_TTL_MS:-86400000}
      FINANCEBOT_ALERTS_ENABLED: ${FINANCEBOT_ALERTS_ENABLED:-true}
      FINANCEBOT_ALERTS_SCHEDULER_CRON: ${FINANCEBOT_ALERTS_SCHEDULER_CRON:-0 0 9 * * *}
      FINANCEBOT_ALERTS_QUEUE_MESSAGE_TTL_MS: ${FINANCEBOT_ALERTS_QUEUE_MESSAGE_TTL_MS:-604800000}

      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      TELEGRAM_INTERNAL_TOKEN: ${TELEGRAM_INTERNAL_TOKEN}
      FINANCEBOT_MANAGEMENT_PORT: 8082
      FINANCEBOT_MANAGEMENT_ADDRESS: 0.0.0.0

    networks:
      - backend-network

networks:
  backend-network:
    external: true
