spring:
  datasource:
    url: jdbc:h2:mem:financebot_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  data:
    redis:
      host: localhost
      port: 6379
      password:

telegram:
  bot:
    token: test-token
    username: test-bot

app:
  cors:
    allowed-origins: http://localhost:5173
  jwt:
    secret: 1234567890123456789012345678901234567890123456789012345678901234
    expiration: 86400000

management:
  health:
    rabbit:
      enabled: false
    redis:
      enabled: false