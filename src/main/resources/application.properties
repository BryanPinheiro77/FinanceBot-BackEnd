spring.application.name=financebot

server.port=8080

# PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${FINANCEBOT_SQL_LOGGING_ENABLED:false}
spring.jpa.properties.hibernate.format_sql=${FINANCEBOT_SQL_LOGGING_ENABLED:false}

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.username=${REDIS_USER:default}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL_ENABLED:false}

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION}

# Keyring para criptografia de campos sensíveis
app.data-encryption.key=${FINANCEBOT_DATA_ENCRYPTION_KEY:}
app.data-encryption.active-key-id=${FINANCEBOT_DATA_ENCRYPTION_ACTIVE_KEY_ID:primary}
app.data-encryption.legacy-key-id=${FINANCEBOT_DATA_ENCRYPTION_LEGACY_KEY_ID:${FINANCEBOT_DATA_ENCRYPTION_ACTIVE_KEY_ID:primary}}
app.data-encryption.previous-keys=${FINANCEBOT_DATA_ENCRYPTION_PREVIOUS_KEYS:}
app.data-encryption.rotation.enabled=${FINANCEBOT_DATA_ENCRYPTION_ROTATION_ENABLED:false}
app.data-encryption.rotation.backup-confirmed=${FINANCEBOT_DATA_ENCRYPTION_ROTATION_BACKUP_CONFIRMED:false}
app.data-encryption.rotation.batch-size=${FINANCEBOT_DATA_ENCRYPTION_ROTATION_BATCH_SIZE:100}
app.data-encryption.rotation.interval-ms=${FINANCEBOT_DATA_ENCRYPTION_ROTATION_INTERVAL_MS:1000}

# Observabilidade
management.server.port=${FINANCEBOT_MANAGEMENT_PORT:8082}
management.server.address=${FINANCEBOT_MANAGEMENT_ADDRESS:127.0.0.1}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
logging.structured.format.console=${FINANCEBOT_LOG_FORMAT:ecs}

spring.docker.compose.enabled=false

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Shared secret used by the Telegram bot for internal endpoints
telegram.internal-token=${TELEGRAM_INTERNAL_TOKEN:}
financebot.recurring.scheduler.cron=${FINANCEBOT_RECURRING_SCHEDULER_CRON:0 0 0 * * *}
financebot.reminders.publish-interval=${FINANCEBOT_REMINDERS_PUBLISH_INTERVAL:60000}
financebot.reminders.queue-message-ttl-ms=${FINANCEBOT_REMINDERS_QUEUE_MESSAGE_TTL_MS:86400000}
