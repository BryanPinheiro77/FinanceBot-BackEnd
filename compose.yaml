services:
  postgres:
    image: 'postgres:17'
    environment:
     - 'POSTGRES_DB=financebot'
     - 'POSTGRES_PASSWORD=postgres'
     - 'POSTGRES_USER=postgres'
    ports:
      - '5432:5432'
    volumes:
      - 'postgres_data:/var/lib/postgresql/data'

  rabbitmq:
    image: 'rabbitmq:management'
    container_name: financebot-rabbitmq
    environment:
      - 'RABBITMQ_DEFAULT_PASS=guest'
      - 'RABBITMQ_DEFAULT_USER=guest'
    ports:
      - '5672:5672'
      - '15672:15672'
  redis:
    image: 'redis:latest'
    container_name: financebot-redis
    ports:
      - '6379:6379'

volumes:
    postgres_data:
