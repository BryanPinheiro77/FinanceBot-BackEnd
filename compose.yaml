services:
  financebot:
    build: .
    container_name: financebot-backend
    ports:
      - "8080:8080"

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/financebot
      DB_USER: postgres
      DB_PASSWORD: postgres

      REDIS_HOST: redis
      REDIS_PORT: 6379

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest

    networks:
      - backend-network

networks:
  backend-network:
    external: true