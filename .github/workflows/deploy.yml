name: Deploy FinanceBot

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy backend
        run: |
          cd /home/bryan/FinanceBot-BackEnd
          git pull
          docker compose -f compose.prod.yml up -d --build

      - name: Deploy telegram bot
        run: |
          cd /home/bryan/FinanceBot-BackEnd/financebot-telegram-bot
          git pull
          docker compose -f compose.prod.yml up -d --build
