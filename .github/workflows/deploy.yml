name: Deploy FinanceBot

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy backend
        env:
          DEPLOY_PATH: ${{ vars.FINANCEBOT_DEPLOY_PATH }}
        run: |
          test -n "$DEPLOY_PATH"
          cd "$DEPLOY_PATH"
          git pull
          docker compose -f compose.prod.yml up -d --build

      - name: Deploy telegram bot
        env:
          DEPLOY_PATH: ${{ vars.FINANCEBOT_DEPLOY_PATH }}
        run: |
          test -n "$DEPLOY_PATH"
          cd "$DEPLOY_PATH/financebot-telegram-bot"
          git pull
          docker compose -f compose.prod.yml up -d --build
