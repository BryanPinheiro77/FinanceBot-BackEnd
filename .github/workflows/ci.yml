name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API - build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test API
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

  telegram-bot:
    name: Telegram bot - build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: financebot-telegram-bot
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test Telegram bot
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check whitespace errors
        run: git diff --check HEAD^ HEAD
