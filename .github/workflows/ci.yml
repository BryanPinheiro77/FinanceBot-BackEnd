name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API - build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test API
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

  telegram-bot:
    name: Telegram bot - build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: financebot-telegram-bot
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test Telegram bot
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

  containers:
    name: Docker - ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module: [api, telegram-bot]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify build context and runtime image
        run: python3 scripts/verify-container-images.py --module "${{ matrix.module }}"

  backup-tools:
    name: Backup - safety and restore smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install test prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes restic
          docker pull postgres:17
      - name: Validate systemd templates
        run: systemd-analyze verify infra/backup/financebot-backup.service infra/backup/financebot-backup.timer
      - name: Test backup safety and real isolated recovery
        env:
          FINANCEBOT_BACKUP_SMOKE: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s scripts/backup/tests -v

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whitespace errors
        run: git diff --check "$(git merge-base HEAD origin/main)" HEAD
